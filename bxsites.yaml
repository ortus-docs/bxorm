name: "BxORM"
description: "The ORM framework for BoxLang. Map BoxLang classes to tables and work with rows as objects: static helpers, fluent criteria, automatic type conversion, readable errors and a boot cache, all on Hibernate 7."
baseURL: "https://bxorm.boxlang.io/"
source: src
theme:
    name: bootstrap
    options:
        {
            colorMode: dark,
            navCollapsible: true,
            navExpandAll: false,
            tocPosition: sticky,
            accentColor: "#00a37c",
            accentColorDark: "#2ee66b",
        }
    logo: "assets/bxorm-logo.png"
    favicon: "assets/favicon.png"
search: true
markdown:
    enableFootnotes: true
    enableDefinitionLists: true
repo:
    url: "https://github.com/ortus-docs/bxorm"
    editUri: "edit/master/src/"
social:
    - url: "https://github.com/ortus-boxlang/bx-orm"
      icon: github
      label: "BxORM on GitHub"
    - url: "https://x.com/TryBoxLang"
      icon: twitter
      label: "X (Twitter)"
    - url: "https://www.youtube.com/@OrtusSolutions"
      icon: youtube
      label: "YouTube"
    - url: "https://www.linkedin.com/company/tryboxlang"
      icon: linkedin
      label: "LinkedIn"
    - url: "https://bsky.app/profile/boxlang.bsky.social"
      icon: bluesky
      label: "Bluesky"
    - url: "https://www.ortussolutions.com/community/slack"
      icon: slack
      label: "Slack Community"
footer: true
lastUpdated: true
pageActions: true
