name: Publish Site

# Builds the BxORM homepage and course (src/ + bxsites.yaml) with bx-sites and publishes it to GitHub Pages at
# https://bxorm.boxlang.io
#
# Pull requests only build and check the site. A push to master publishes it.
#
# One time setup in the repository (Settings, Pages):
#   - Source: "Deploy from a branch", branch gh-pages, folder / (root)
#   - Custom domain: bxorm.boxlang.io (and "Enforce HTTPS" once the certificate is ready)
# and in DNS for boxlang.io: a CNAME record  bxorm  ->  ortus-docs.github.io

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "bxsites.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "src/**"
      - "bxsites.yaml"
      - ".github/workflows/site.yml"
  # Manual trigger
  workflow_dispatch:

# Only one publish at a time; a newer push replaces a queued one
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang and bx-sites
        uses: ortus-boxlang/setup-boxlang@1.6.0
        with:
          modules: bx-sites bx-markdown bx-esapi bx-yaml bx-image

      # Broken internal links, missing images or missing alt text fail the build
      - name: Build and Check Site
        run: |
          boxlang bxSites build
          test -s site/index.html
          test -s site/course/index.html
          test -s site/404.html
          boxlang bxSites audit
          touch site/.nojekyll

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: bxorm.boxlang.io
          commit_message: "Site: ${{ github.event.head_commit.message || 'manual publish' }}"
